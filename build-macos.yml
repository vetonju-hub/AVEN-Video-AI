name: AVEN v3.4 - Adaptive Realism Intel und Apple Silicon
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Mac-App und KI-Engine (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-26
    steps:
      - name: Projektdateien holen
        uses: actions/checkout@v4
      - name: Logiktests auf echtem macOS ausführen
        run: bash tests/test_on_mac.sh
      - name: Native App und KI-Engine kompilieren
        run: bash scripts/build_macos.sh
      - name: Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AVEN-v3.4-${{ matrix.arch }}-Mac-Installer
          path: dist/AVEN_Video_AI_v3.4_${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30
